name: Send Mailjet Emails

# Sends this week's email to the whole EpicFreeGamesMail list.
# Manual only: review the Thursday test copy first, then click "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-mail:
    runs-on: ubuntu-latest
    env:
      MJ_APIKEY_PUBLIC: ${{ secrets.MJ_APIKEY_PUBLIC }}
      MJ_APIKEY_PRIVATE: ${{ secrets.MJ_APIKEY_PRIVATE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Send to all subscribers
        working-directory: server
        run: node mailjet-send-template.js
