name: Weekly test email and reminder

# Epic's free games switch over on Thursdays at 11:00 US Eastern (16:00 UTC in winter,
# 15:00 UTC in summer). This runs after that: it sends the test copy of this week's
# email, then a reminder to review it and run "Send Mailjet Emails" by hand.
# Nothing is sent to subscribers from here.
on:
  schedule:
    - cron: "30 16 * * 4" # Thursdays 16:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-remind:
    runs-on: ubuntu-latest
    env:
      MJ_APIKEY_PUBLIC: ${{ secrets.MJ_APIKEY_PUBLIC }}
      MJ_APIKEY_PRIVATE: ${{ secrets.MJ_APIKEY_PRIVATE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Send test email
        working-directory: server
        run: node mailjet-send-template-test.js

      - name: Send reminder
        working-directory: server
        run: node send-reminder.js
